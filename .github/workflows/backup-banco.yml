name: Backup diário do banco

on:
  schedule:
    - cron: "0 7 * * *"   # todo dia às 04:00 no horário de Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do Postgres 17
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Exportar o banco
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then echo "Segredo BACKUP_DATABASE_URL não configurado"; exit 1; fi
          pg_dump --no-owner --no-privileges --schema=public "$BACKUP_DATABASE_URL" | gzip > backup-$(date +%Y-%m-%d).sql.gz
          ls -lh backup-*.sql.gz

      - name: Guardar a cópia (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco
          path: backup-*.sql.gz
          retention-days: 30
