<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkFeed Gráfica - Acesso à Plataforma</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#f1f5f9] min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/90 shadow-md p-8 space-y-6">
    
    <!-- CABEÇALHO COM LOGÓTIPO EMBUTIDO OFICIAL -->
    <div class="text-center space-y-3">
      <div class="flex flex-col items-center justify-center">
        
        <!-- Símbolo W Dobrado em Degradê -->
        <svg class="h-16 w-auto drop-shadow-sm" viewBox="0 0 160 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loginBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0c2340" />
              <stop offset="100%" stop-color="#164e87" />
            </linearGradient>
            <linearGradient id="loginOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff7a00" />
              <stop offset="100%" stop-color="#e65100" />
            </linearGradient>
          </defs>
          
          <!-- Lâmina Azul Esquerda -->
          <path d="M14 18 C14 10, 22 6, 30 6 L46 6 C54 6, 60 12, 62 20 L78 74 C80 82, 74 90, 66 90 L50 90 C42 90, 36 84, 34 76 L15 25 C14 23, 14 20, 14 18 Z" fill="url(#loginBlueGrad)" />
          
          <!-- Dobra Central Laranja (Efeito Ribbon) -->
          <path d="M52 14 C54 7, 62 4, 70 4 L86 4 C94 4, 100 10, 102 18 L114 62 C116 72, 108 82, 98 84 L88 86 C72 88, 62 76, 60 62 L52 14 Z" fill="url(#loginOrangeGrad)" opacity="0.95" />
          <path d="M68 8 C68 8, 58 14, 56 24 L68 76 C72 88, 86 94, 98 90 L108 86 C120 82, 126 68, 122 56 L108 16 C106 10, 100 6, 92 6 Z" fill="url(#loginOrangeGrad)" />
          
          <!-- Lâmina Azul Direita -->
          <path d="M104 18 C104 10, 112 6, 120 6 L136 6 C144 6, 150 12, 152 20 L138 76 C136 84, 128 90, 120 90 L108 90 C104 90, 100 88, 98 84 L96 76 L104 18 Z" fill="url(#loginBlueGrad)" />
        </svg>

        <!-- Tipografia WorkFeed Gráfica Oficial -->
        <div class="mt-2.5 text-center select-none leading-none">
          <span class="text-[26px] font-black tracking-tight text-[#0c2340] block">
            WorkFeed
          </span>
          <span class="text-base font-extrabold tracking-wide text-[#f97316] block mt-1">
            Gráfica
          </span>
        </div>
      </div>
      <p class="text-[11px] text-slate-400 font-medium">Gestão Integrada de Demandas & Produção</p>
    </div>

    {% if error %}
    <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700 font-semibold text-center">
      {{ error }}
    </div>
    {% endif %}

    <!-- ABAS ENTRAR / CRIAR CONTA -->
    <div class="flex border-b border-slate-100 text-xs font-bold text-center">
      <button onclick="toggleForm('login')" id="btn-login-tab" class="w-1/2 py-2.5 border-b-2 border-amber-600 text-amber-600 transition">Entrar</button>
      <button onclick="toggleForm('register')" id="btn-register-tab" class="w-1/2 py-2.5 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition">Criar Conta</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="form-login" action="/login" method="post" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nome de Utilizador</label>
        <input required type="text" name="username" placeholder="ex: robson ou lucas" class="w-full text-xs p-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50/60 font-medium">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Palavra-passe</label>
        <input required type="password" name="password" placeholder="••••••••" class="w-full text-xs p-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50/60">
      </div>
      <button type="submit" class="w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-xs transition shadow-xs active:scale-95">
        Entrar no Sistema
      </button>
    </form>

    <!-- FORMULÁRIO DE REGISTO -->
    <form id="form-register" action="/register" method="post" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nome Completo</label>
        <input required type="text" name="full_name" placeholder="ex: Robson Ramos" class="w-full text-xs p-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50/60">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nome de Utilizador (login)</label>
        <input required type="text" name="username" placeholder="ex: robson.ramos" class="w-full text-xs p-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50/60">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Função / Cargo</label>
        <select name="role" class="w-full text-xs p-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50/60 font-semibold text-slate-700">
          <option value="Gestor">Gestor de Equipa</option>
          <option value="Colaborador">Colaborador (Pré-Impressão / Arte-final)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Definir Palavra-passe</label>
        <input required type="password" name="password" placeholder="••••••••" class="w-full text-xs p-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50/60">
      </div>
      <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-xs active:scale-95">
        Registar Utilizador
      </button>
    </form>

  </div>

  <script>
    function toggleForm(type) {
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const btnLogin = document.getElementById('btn-login-tab');
      const btnRegister = document.getElementById('btn-register-tab');

      if (type === 'login') {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        btnLogin.className = "w-1/2 py-2.5 border-b-2 border-amber-600 text-amber-600 transition";
        btnRegister.className = "w-1/2 py-2.5 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition";
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        btnRegister.className = "w-1/2 py-2.5 border-b-2 border-amber-600 text-amber-600 transition";
        btnLogin.className = "w-1/2 py-2.5 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition";
      }
    }
  </script>
</body>
</html>
