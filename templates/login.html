<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkFeed Gráfica - Acesso à Plataforma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200/80 shadow-sm p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl mx-auto shadow-md shadow-indigo-100">
        W
      </div>
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">WorkFeed Gráfica</h1>
      <p class="text-xs text-slate-500">Gestão e Homologação de Ferramentais</p>
    </div>

    {% if error %}
    <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700 font-semibold text-center">
      {{ error }}
    </div>
    {% endif %}

    <div class="flex border-b border-slate-100 text-xs font-bold text-center">
      <button onclick="toggleForm('login')" id="btn-login-tab" class="w-1/2 py-2 border-b-2 border-indigo-600 text-indigo-600">Entrar</button>
      <button onclick="toggleForm('register')" id="btn-register-tab" class="w-1/2 py-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600">Criar Conta</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="form-login" action="/login" method="post" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nome de Utilizador</label>
        <input required type="text" name="username" placeholder="ex: robson ou lucas" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Palavra-passe</label>
        <input required type="password" name="password" placeholder="••••••••" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition shadow-xs">
        Entrar no Sistema
      </button>
    </form>

    <!-- FORMULÁRIO DE REGISTO -->
    <form id="form-register" action="/register" method="post" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nome Completo</label>
        <input required type="text" name="full_name" placeholder="ex: Robson Ramos" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nome de Utilizador (login)</label>
        <input required type="text" name="username" placeholder="ex: robson.ramos" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Função / Cargo</label>
        <select name="role" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-semibold text-slate-700">
          <option value="Gestor">Gestor de Equipa</option>
          <option value="Colaborador">Colaborador (Pré-Impressão / Arte-final)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Definir Palavra-passe</label>
        <input required type="password" name="password" placeholder="••••••••" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>
      <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-xs">
        Registar Utilizador
      </button>
    </form>
  </div>

  <script>
    function toggleForm(type) {
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const btnLogin = document.getElementById('btn-login-tab');
      const btnRegister = document.getElementById('btn-register-tab');

      if (type === 'login') {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        btnLogin.className = "w-1/2 py-2 border-b-2 border-indigo-600 text-indigo-600";
        btnRegister.className = "w-1/2 py-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600";
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        btnRegister.className = "w-1/2 py-2 border-b-2 border-indigo-600 text-indigo-600";
        btnLogin.className = "w-1/2 py-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600";
      }
    }
  </script>
</body>
</html>
